<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>介護利用者管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow mx-auto" style="max-width: 500px;">
        <div class="card-header bg-primary text-white text-center">
            <h3>利用者登録</h3>
        </div>
        <div class="card-body">
            <form action="/submit" method="post">
                <div class="mb-3">
                    <label class="form-label">利用者名</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">担当ケアマネ</label>
                    <input type="text" name="care_manager" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">介護区分</label>
                    <select name="care_level" class="form-select">
                        <option value="要支援１">要支援１</option>
                        <option value="要支援２">要支援２</option>
                        <option value="事業">事業</option>
                        <option value="要介護１">要介護１</option>
                        <option value="要介護２">要介護２</option>
                        <option value="要介護３">要介護３</option>
                        <option value="要介護４">要介護４</option>
                        <option value="要介護５">要介護５</option>
                    </select>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">保存する</button>
                    <a href="/dashboard" class="btn btn-outline-secondary">一覧表を見る</a>
                </div>
            </form> </div>
    </div>
</div>
</body>
</html>
