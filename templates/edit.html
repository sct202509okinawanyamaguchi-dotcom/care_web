<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>利用者情報の編集</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow mx-auto" style="max-width: 500px;">
        <div class="card-header bg-primary text-white text-center">
            <h3>利用者情報の編集</h3>
        </div>
        <div class="card-body">
            <form action="/update/{{ user_id }}" method="post">
                <div class="mb-3">
                    <label class="form-label">利用者名</label>
                    <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">担当ケアマネ</label>
                    <input type="text" name="care_manager" class="form-control" value="{{ user.care_manager }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">介護区分</label>
                    <select name="care_level" class="form-select">
                        {% for level in ["要支援１","要支援２","事業","要介護１","要介護２","要介護３","要介護４","要介護５"] %}
                        <option value="{{ level }}" {% if user.care_level == level %}selected{% endif %}>{{ level }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success flex-grow-1">更新する</button>
                    <a href="/dashboard" class="btn btn-secondary">キャンセル</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
