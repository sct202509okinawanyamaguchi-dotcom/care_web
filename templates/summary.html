<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>集計結果</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow">
        <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">介護区分 × 担当ケアマネ 集計表</h4>
            <a href="/download" class="btn btn-light btn-sm">Excelダウンロード</a>
        </div>
        <div class="card-body p-0">
            <table class="table table-bordered table-hover mb-0 text-center">
                <thead class="table-secondary">
                    <tr>
                        <th>介護区分</th>
                        {% for col in columns %}
                        <th>{{ col }}</th>
                        {% endfor %}
                        <th class="table-warning">社内合計</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in table %}
                    <tr>
                        <td class="fw-bold bg-light">{{ row["care_level"] }}</td>
                        {% for col in columns %}
                        <td>{{ row[col] }}</td>
                        {% endfor %}
                        <td class="table-warning fw-bold">{{ row["社内合計数"] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    <div class="mt-4">
        <a href="/" class="btn btn-secondary">戻る</a>
    </div>
</div>
</body>
</html>
